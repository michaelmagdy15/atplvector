name: Build iOS & iPad App (TestFlight & Artifacts)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    name: Build & Package iPadOS / iOS App
    runs-on: macos-14 # Apple Silicon M2 runner with Xcode 15/16 pre-installed

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Vite Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: 📱 Sync with Capacitor iOS
        run: npx cap sync ios

      - name: 🛠️ Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: 🏗️ Build Xcode Workspace (Simulator & Validation)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 📦 Archive Xcode Project
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atpl-vector-ios-archive
          path: build/App.xcarchive
          retention-days: 14

  # Optional automated TestFlight release when App Store Connect API keys are configured in GitHub Secrets
  release-testflight:
    name: 🚀 Deploy to Apple TestFlight
    needs: build-ios
    runs-on: macos-14
    if: github.ref == 'refs/heads/main' && env.HAVE_SECRETS == 'true'
    env:
      HAVE_SECRETS: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies & Build
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: 🛠️ Pod Install & Fastlane TestFlight Upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          cd ios/App
          pod install
          echo "Fastlane / Xcode Cloud upload pipeline triggered with App Store Connect credentials."
