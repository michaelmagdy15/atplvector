name: Build iOS & iPad App (TestFlight & Artifacts)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  APP_BUNDLE_ID: 'com.atplvector01.app'
  APP_NAME: 'ATPL Vector'

jobs:
  build-ios:
    name: Build & Package iPadOS / iOS App
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Vite Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: 📱 Sync with Capacitor iOS
        run: npx cap sync ios

      - name: 🛠️ Select Xcode 16 (iOS 18 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null
          xcodebuild -version

      - name: 🛠️ Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: 🏗️ Build Xcode Workspace (Simulator & Validation)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 📦 Archive & Package iOS Application
        run: |
          mkdir -p build
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          
          # Create Payload directory for standard .ipa packaging
          mkdir -p ../../build/Payload
          cp -r ../../build/App.xcarchive/Products/Applications/App.app ../../build/Payload/
          cd ../../build
          zip -r atpl-vector-ios-app.zip Payload
          zip -r atpl-vector-archive.zip App.xcarchive

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atpl-vector-ios-build
          path: |
            build/atpl-vector-ios-app.zip
            build/atpl-vector-archive.zip
          retention-days: 14

      # Upload the entire synced iOS project so TestFlight job can reuse it
      - name: 📤 Upload Synced iOS Project for TestFlight
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-synced
          path: |
            ios/
            node_modules/@capacitor/
          retention-days: 1

  release-testflight:
    name: 🚀 Deploy to Apple TestFlight
    needs: build-ios
    runs-on: macos-14
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies & Build
        run: |
          npm ci
          npm run build
          npx cap sync ios
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: 🔐 Setup Apple API Key for Signing
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_CONTENT" ]; then
            echo "❌ APP_STORE_CONNECT_PRIVATE_KEY secret is not set. Skipping TestFlight deployment."
            exit 1
          fi

          # Validate required secrets
          echo "🔍 Validating Apple credentials..."
          echo "  Key ID:    ${APP_STORE_CONNECT_API_KEY_ID:0:3}***"
          echo "  Issuer ID: ${APP_STORE_CONNECT_ISSUER_ID:0:5}***"

          # Write the API key to the standard Fastlane/Xcode search paths
          node scripts/validate-apple-api.cjs

      - name: 🛠️ Select Xcode 16 (iOS 18 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null
          xcodebuild -version

      - name: 🛠️ Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: 📝 Set Build Number from CI Run
        run: |
          cd ios/App
          # Use GitHub run number as build number so TestFlight always accepts it
          BUILD_NUMBER=${{ github.run_number }}
          echo "Setting CURRENT_PROJECT_VERSION to ${BUILD_NUMBER}"
          
          # Update the Xcode project build number via agvtool
          agvtool new-version -all "${BUILD_NUMBER}"
          
      - name: 🧹 Cleanup Stale Development Certificates
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          node scripts/cleanup-dev-certs.cjs

      - name: 🚀 Fastlane TestFlight Upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd ios/App
          fastlane beta
        
      - name: 🔍 Diagnose Failure (on error)
        if: failure()
        run: |
          echo "============================================="
          echo "🔍 FAILURE DIAGNOSTICS"
          echo "============================================="
          echo ""
          echo "--- Xcode version ---"
          xcodebuild -version
          echo ""
          echo "--- Available signing identities ---"
          security find-identity -v -p codesigning || true
          echo ""
          echo "--- Provisioning profiles ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles found"
          echo ""
          echo "--- Ruby/Fastlane versions ---"
          ruby -v
          gem list fastlane 2>/dev/null || true
          echo ""
          echo "--- Xcode build settings ---"
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -showBuildSettings 2>/dev/null | grep -E "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING|PRODUCT_BUNDLE" || true
          echo ""
          echo "--- Fastlane log tail ---"
          cat ~/Library/Logs/fastlane/log.txt 2>/dev/null | tail -100 || echo "No Fastlane log found"
          echo "============================================="
